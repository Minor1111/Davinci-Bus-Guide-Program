<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>다빈치 버스</title>
<style>
  :root {
    --bg:#f3f5f9; --card:#ffffff; --text:#171b26; --sub:#667085; --line:#e4e7ee;
    --accent:#1553d6; --accent-soft:#e6eeff; --on-accent:#ffffff;
    --ok:#0f8a4b; --ok-soft:#e3f5ea; --warn:#8a5a00; --warn-soft:#fff3d4;
    --past:#aab0bd; --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0f1219; --card:#181c26; --text:#eceff6; --sub:#9aa3b5; --line:#272c3a;
      --accent:#6f98ff; --accent-soft:#1d2a4d; --on-accent:#0b1020;
      --ok:#4cd08a; --ok-soft:#14302140; --warn:#f2c35b; --warn-soft:#3a2d0e;
      --past:#566074; --shadow:none;
    }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; line-height:1.45; }
  main { max-width:560px; margin:0 auto; padding:16px 16px 48px; }
  header { display:flex; justify-content:space-between; align-items:flex-end; gap:12px; margin-bottom:12px; }
  h1 { font-size:1.35rem; margin:0; letter-spacing:-.02em; }
  .clock { text-align:right; font-variant-numeric:tabular-nums; }
  .clock b { font-size:1.35rem; display:block; line-height:1.1; }
  .clock span { color:var(--sub); font-size:.8rem; }

  .seg { display:grid; grid-template-columns:1fr 1fr; background:var(--line); border-radius:12px; padding:3px; margin-bottom:14px; }
  .seg button { border:0; background:transparent; color:var(--sub); padding:10px 6px; border-radius:10px; font:inherit; font-weight:600; cursor:pointer; }
  .seg button[aria-selected="true"] { background:var(--card); color:var(--text); box-shadow:var(--shadow); }

  .banner { border-radius:12px; padding:10px 12px; font-size:.88rem; margin-bottom:12px; background:var(--warn-soft); color:var(--warn); }
  .banner.info { background:var(--accent-soft); color:var(--accent); }
  .banner[hidden] { display:none; }

  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
  .chip { border:1px solid var(--line); background:var(--card); color:var(--text); padding:7px 12px; border-radius:999px; font:inherit; font-size:.88rem; cursor:pointer; }
  .chip[aria-pressed="true"], .chip.on { background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:600; }
  .label { color:var(--sub); font-size:.82rem; margin-right:2px; }

  h2 { font-size:.95rem; margin:18px 2px 8px; color:var(--sub); font-weight:700; display:flex; justify-content:space-between; align-items:center; }
  h2 a { font-weight:500; font-size:.8rem; color:var(--accent); text-decoration:none; }
  .card { background:var(--card); border-radius:16px; padding:14px 16px; margin-bottom:10px; box-shadow:var(--shadow); }

  .soon { display:grid; gap:8px; }
  .soon .item { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .soon .name { font-weight:600; font-size:.95rem; }
  .soon .from { color:var(--sub); font-size:.78rem; }
  .soon .when { text-align:right; font-variant-numeric:tabular-nums; }
  .soon .when b { font-size:1.25rem; color:var(--accent); }
  .soon .when span { display:block; font-size:.78rem; color:var(--sub); }

  .rt-head { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .rt-title { font-weight:700; }
  .rt-path { color:var(--sub); font-size:.8rem; margin-top:2px; }
  .star { border:0; background:transparent; font-size:1.25rem; line-height:1; cursor:pointer; color:var(--past); padding:2px 4px; }
  .star[aria-pressed="true"] { color:#f5b301; }
  .eta { display:inline-block; margin:10px 0 8px; padding:4px 10px; border-radius:999px; font-size:.85rem; font-weight:600; background:var(--accent-soft); color:var(--accent); }
  .eta.none { background:var(--line); color:var(--sub); font-weight:500; }
  .times { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
  .t { text-align:center; padding:7px 0; border:1px solid var(--line); border-radius:9px; font-variant-numeric:tabular-nums; font-size:.92rem; position:relative; }
  .t.past { color:var(--past); text-decoration:line-through; }
  .t.next { background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:700; }
  .t small { display:block; font-size:.68rem; line-height:1; margin-top:1px; text-decoration:none; }
  .t.warn::after { content:"⚠"; position:absolute; top:-5px; right:-3px; font-size:.7rem; }
  .note { color:var(--sub); font-size:.78rem; margin-top:8px; }

  details.place { padding:0; }
  details.place > summary { list-style:none; cursor:pointer; padding:14px 16px; display:flex; justify-content:space-between; gap:8px; align-items:center; }
  details.place > summary::-webkit-details-marker { display:none; }
  details.place[open] > summary { border-bottom:1px solid var(--line); }
  .place .pn { font-weight:700; }
  .place .ps { color:var(--sub); font-size:.8rem; }
  .place .body { padding:12px 16px 14px; }
  .dir { font-weight:700; font-size:.85rem; margin:10px 0 6px; }
  .dir:first-child { margin-top:0; }
  .arr { display:flex; justify-content:space-between; gap:10px; padding:8px 0; border-top:1px solid var(--line); font-size:.92rem; }
  .arr:first-of-type { border-top:0; }
  .arr .l small { display:block; color:var(--sub); font-size:.76rem; }
  .arr .r { text-align:right; font-variant-numeric:tabular-nums; }
  .arr .r b { color:var(--accent); }
  .arr .r small { display:block; color:var(--sub); font-size:.76rem; }
  .msg { color:var(--sub); font-size:.88rem; }
  .msg.err { color:var(--warn); }

  details.keys { margin-top:16px; }
  details.keys summary { cursor:pointer; font-weight:600; }
  .keys label { display:block; font-size:.82rem; color:var(--sub); margin:10px 0 4px; }
  .keys input { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--text); font:inherit; }
  .btn { border:0; background:var(--accent); color:var(--on-accent); padding:10px 14px; border-radius:10px; font:inherit; font-weight:600; cursor:pointer; }
  .btn.ghost { background:var(--line); color:var(--text); }
  .btn:disabled { opacity:.5; cursor:default; }
  footer { color:var(--sub); font-size:.78rem; margin-top:22px; text-align:center; }
  footer a { color:var(--accent); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>🚌 다빈치 버스</h1>
      <div class="label">중앙대 다빈치캠퍼스 · 2026-2학기</div>
    </div>
    <div class="clock"><b id="clockT">--:--</b><span id="clockD"></span></div>
  </header>

  <div class="seg" role="tablist" aria-label="화면 선택">
    <button role="tab" id="tab-shuttle" aria-selected="true" data-screen="shuttle">학교 셔틀버스</button>
    <button role="tab" id="tab-city" aria-selected="false" data-screen="city">마을·시내·직행버스</button>
  </div>

  <!-- 화면 1: 학교 셔틀버스 -->
  <section id="screen-shuttle" aria-labelledby="tab-shuttle">
    <div id="banner" class="banner" hidden></div>

    <div class="row" id="dayRow">
      <span class="label">보는 요일</span>
      <button class="chip" data-day="mt">월~목</button>
      <button class="chip" data-day="fri">금</button>
    </div>

    <h2>곧 출발하는 버스</h2>
    <div class="card"><div class="soon" id="soon"></div></div>

    <div class="row" id="filterRow"></div>
    <div id="routes"></div>
    <div class="note">⚠ 표시는 시간표 원문 그대로 옮긴 시각이에요. 오기일 수 있으니 타기 전에 확인해요. "2대"는 그 시각에 버스 2대가 운행한다는 뜻이에요.</div>
  </section>

  <!-- 화면 2: 마을·시내·직행버스 -->
  <section id="screen-city" aria-labelledby="tab-city" hidden>
    <div class="banner info" id="cityBanner"></div>
    <div id="places"></div>

    <details class="keys card" id="keysPanel">
      <summary>API 키 설정</summary>
      <label for="keyDG">공공데이터포털 인증키 (경기도 버스도착정보)</label>
      <input id="keyDG" type="password" autocomplete="off" placeholder="발급받은 일반 인증키를 붙여넣어요">
      <div class="row" style="margin-top:12px">
        <button class="btn" id="keySave">저장하고 다시 불러오기</button>
        <button class="btn ghost" id="keyClear">키 지우기</button>
      </div>
      <div class="note" id="keyNote"></div>
    </details>
  </section>

  <footer>
    셔틀 시간표 출처: 「2026-2학기 다빈치캠퍼스 노선별 버스 운행 시간표(통학버스 등)」 · 운행 2026. 9. 1. ~ 12. 21.<br>
    셔틀은 실시간 위치가 없어서 시간표 기준이에요. 변경은 <a href="https://www.cau.ac.kr" target="_blank" rel="noopener">학교 공지</a>에서 확인해요.
  </footer>
</main>

<script>
/* ===== 1. 설정 (KEYS) ===== */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
let KEYS = store.get("dvb-keys", {});

/* ===== 2. 셔틀 시간표 (ROUTES) — 학기마다 이 부분만 바꿔요 ===== */
const PERIOD = { start: "2026-09-01", end: "2026-12-21" };
// 손으로 관리하는 공휴일 (운행 기간 안). 대체공휴일 포함.
const HOLIDAYS = new Set(["2026-09-24", "2026-09-25", "2026-09-26", "2026-10-03", "2026-10-05", "2026-10-09"]);

// T(시각, 월~목 대수, 금 대수, 경고) — 대수 0이면 그 요일은 운행하지 않아요.
const T = (t, mt = 1, fri = 1, warn = "") => ({ t, c: { mt, fri }, warn });
const KUMHO1 = { name: "금호고속 김용희 대리", tel: ["02-530-6311", "010-8060-0287"] };
const KUMHO2 = { name: "금호고속 박재훈 대리", tel: ["010-5954-0323"] };

const GROUPS = [
  { id: "bus", name: "서울 통학버스 (903)", contact: KUMHO1 },
  { id: "cross", name: "캠퍼스 간 교차버스 (다빈치 ↔ 서울캠퍼스)", contact: KUMHO2 },
  { id: "ptk", name: "평택역버스", contact: KUMHO2 },
  { id: "loop", name: "교내순환버스", contact: KUMHO2 },
];
const ROUTES = [
  { id: "down", group: "bus", name: "서울 → 다빈치 (하행)",
    path: "서울고속버스터미널(고속터미널역 3번 출구 앞) → 죽전간이정류장 → 다빈치캠퍼스 903관 앞",
    times: [T("7:50"), T("7:55", 2, 1), T("8:50")] },
  { id: "up", group: "bus", name: "다빈치 → 서울 (상행)",
    path: "다빈치캠퍼스 903관 앞 → 죽전간이정류장 → 서울고속버스터미널(내 하차장)",
    times: [T("14:40"), T("15:40", 1, 0), T("17:40"), T("18:40")] },
  { id: "x-seoul", group: "cross", name: "다빈치 → 서울캠퍼스",
    path: "중앙문화관(801관) 앞 정류장 출발", times: [T("7:20")] },
  { id: "x-davinci", group: "cross", name: "서울캠퍼스 → 다빈치",
    path: "본관(201관) 앞 출발", times: [T("18:10")] },
  { id: "ptk-to", group: "ptk", name: "다빈치 → 평택역",
    path: "원형관(810관) 출발",
    times: ["9:20", "10:40", "11:40", "13:40", "14:40", "15:40", "16:40", "17:50"].map(t => T(t)) },
  { id: "ptk-from", group: "ptk", name: "평택역 → 다빈치",
    path: "종합사회복지관 출발",
    times: ["8:45", "8:50", "10:00", "10:40", "11:40", "14:40", "15:40", "16:40", "17:50"].map(t => T(t)) },
  { id: "loop-gate", group: "loop", name: "교내순환 · 정문",
    path: "정문 출발/정차",
    times: ["9:00", "9:20", "9:40", "10:15", "10:45", "11:15", "11:45", "13:15", "13:45", "14:15",
            "14:45", "15:10", "15:30", "15:50", "16:10", "16:30", "16:50", "17:10", "17:30", "17:50"].map(t => T(t)) },
  { id: "loop-round", group: "loop", name: "교내순환 · 원형관(810관)",
    path: "원형관(810관) 출발/정차",
    // 7회차 12:55는 원문 그대로 (11:55 오기 가능성). 임의로 고치지 않는다.
    times: ["9:07", "9:27", "9:47", "10:25", "10:55", "11:25", T("12:55", 1, 1, "원문 그대로예요. 11:55 오기일 수 있어요."),
            "13:25", "13:55", "14:25", "14:55", "15:17", "15:37", "15:57", "16:17", "16:37", "16:57", "17:17", "17:37", "18:00"]
      .map(t => typeof t === "string" ? T(t) : t) },
];

/* ===== 3. 시내·직행 데이터 (실시간 정류장 9곳) ===== */
const PLACES = [
  { name: "중앙대.롯데캐슬아파트" }, { name: "대학9길" }, { name: "중앙대학로.대학1길" },
  { name: "중앙대입구", no: "34153" }, { name: "중앙대생활관.기숙사" }, { name: "801관중앙문화관앞" },
  { name: "810관원형관앞" }, { name: "내리하나로마트" }, { name: "중앙대학로.내리1길" },
];

/* ===== 4. 공통 함수 ===== */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const toMin = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
const pad = n => String(n).padStart(2, "0");
const WD = ["일", "월", "화", "수", "목", "금", "토"];

// 시간 계산은 항상 한국 시간 기준 (기기 시간대를 쓰지 않는다)
function seoulNow() {
  const p = {};
  new Intl.DateTimeFormat("en-US", { timeZone: "Asia/Seoul", year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", hourCycle: "h23", weekday: "short" })
    .formatToParts(new Date()).forEach(x => p[x.type] = x.value);
  const dow = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].indexOf(p.weekday);
  return { ymd: `${p.year}-${p.month}-${p.day}`, dow, hh: +p.hour, mm: +p.minute, min: +p.hour * 60 + +p.minute };
}
function etaText(diff) {
  if (diff <= 0) return "지금 출발해요";
  if (diff < 60) return `${diff}분 후`;
  const h = Math.floor(diff / 60), m = diff % 60;
  return m ? `${h}시간 ${m}분 후` : `${h}시간 후`;
}

/* ===== 5. 화면 전환 ===== */
const ui = Object.assign({ screen: "shuttle", filter: "all", day: null }, store.get("dvb-ui", {}));
let favs = store.get("dvb-fav", []);
const saveUi = () => store.set("dvb-ui", { screen: ui.screen, filter: ui.filter });

function setScreen(s) {
  ui.screen = s; saveUi();
  $("#screen-shuttle").hidden = s !== "shuttle";
  $("#screen-city").hidden = s !== "city";
  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-selected", b.dataset.screen === s));
  if (s === "city") refreshOpenPlaces(false);
}
document.querySelectorAll(".seg button").forEach(b => b.onclick = () => setScreen(b.dataset.screen));

/* ===== 6. 셔틀 렌더 ===== */
function dayState(now) {
  const weekend = now.dow === 0 || now.dow === 6;
  const holiday = HOLIDAYS.has(now.ymd);
  const inPeriod = now.ymd >= PERIOD.start && now.ymd <= PERIOD.end;
  const runs = inPeriod && !weekend && !holiday;
  return { weekend, holiday, inPeriod, runs, todayKey: now.dow === 5 ? "fri" : "mt" };
}

function nextOf(route, day, now, isLive) {
  const list = route.times.filter(x => x.c[day] > 0);
  const idx = isLive ? list.findIndex(x => toMin(x.t) >= now.min) : -1;
  return { list, idx, next: idx >= 0 ? list[idx] : null };
}

function renderShuttle() {
  const now = seoulNow(), ds = dayState(now);
  if (!ui.day) ui.day = ds.todayKey;
  const isLive = ds.runs && ui.day === ds.todayKey;

  // 안내 배너
  const b = $("#banner");
  let msg = "";
  if (!ds.inPeriod) msg = `운행 기간(2026. 9. 1. ~ 12. 21.)이 아니에요. 아래는 학기 중 시간표예요.`;
  else if (ds.holiday) msg = `오늘은 공휴일이에요. 시간표에 공휴일 운행 표시가 없어 운행하지 않는 것으로 보는데, 확실하지 않아요. 학교 공지를 확인해요.`;
  else if (ds.weekend) msg = `오늘은 주말이에요. 시간표에 주말 운행 표시가 없어 운행하지 않는 것으로 보는데, 확실하지 않아요.`;
  b.hidden = !msg; b.textContent = msg;

  document.querySelectorAll("#dayRow .chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.day === ui.day));

  // 곧 출발하는 버스 (즐겨찾기 먼저, 이후 가까운 순)
  const upcoming = ROUTES.map(r => ({ r, ...nextOf(r, ui.day, now, isLive) }))
    .filter(x => x.next)
    .sort((a, b) => (favs.includes(b.r.id) - favs.includes(a.r.id)) || toMin(a.next.t) - toMin(b.next.t))
    .slice(0, 5);
  $("#soon").innerHTML = !isLive
    ? `<div class="msg">${ds.runs ? "보는 요일이 오늘과 달라서 남은 시간을 계산하지 않아요." : "오늘은 운행 정보가 없어요."} 아래에서 시간표를 확인해요.</div>`
    : upcoming.length
      ? upcoming.map(x => `<div class="item"><div><div class="name">${favs.includes(x.r.id) ? "★ " : ""}${esc(x.r.name)}</div>
          <div class="from">${esc(x.r.path.split(" → ")[0])}</div></div>
          <div class="when"><b>${x.next.t}</b><span>${etaText(toMin(x.next.t) - now.min)}</span></div></div>`).join("")
      : `<div class="msg">오늘 남은 셔틀이 없어요.</div>`;

  // 필터
  const fr = $("#filterRow");
  const chips = [["all", "전체"], ["fav", "★ 즐겨찾기"], ...GROUPS.map(g => [g.id, g.name.split(" (")[0]])];
  fr.innerHTML = chips.map(([k, n]) => `<button class="chip" data-filter="${k}" aria-pressed="${ui.filter === k}">${esc(n)}</button>`).join("");

  // 노선 카드
  let html = "";
  GROUPS.forEach(g => {
    const rs = ROUTES.filter(r => r.group === g.id && (ui.filter === "all" || ui.filter === g.id || (ui.filter === "fav" && favs.includes(r.id))));
    if (!rs.length) return;
    const c = g.contact;
    html += `<h2><span>${esc(g.name)}</span><a href="tel:${c.tel[0].replace(/-/g, "")}">문의 ${esc(c.name.replace("금호고속 ", ""))} ☎</a></h2>`;
    rs.forEach(r => {
      const { list, idx, next } = nextOf(r, ui.day, now, isLive);
      const eta = !isLive ? `<span class="eta none">${list.length ? `첫차 ${list[0].t} · 막차 ${list[list.length - 1].t}` : "이 요일은 운행하지 않아요"}</span>`
        : next ? `<span class="eta">다음 ${next.t} · ${etaText(toMin(next.t) - now.min)}</span>`
        : `<span class="eta none">오늘 운행이 끝났어요</span>`;
      const cells = list.map((x, i) => {
        const cls = ["t"];
        if (isLive && (idx === -1 || i < idx)) cls.push("past");
        if (i === idx) cls.push("next");
        if (x.warn) cls.push("warn");
        const n = x.c[ui.day];
        return `<div class="${cls.join(" ")}" ${x.warn ? `title="${esc(x.warn)}"` : ""}>${x.t}${n > 1 ? `<small>${n}대</small>` : ""}</div>`;
      }).join("");
      const warns = [...new Set(list.filter(x => x.warn).map(x => `${x.t} ${x.warn}`))];
      html += `<div class="card"><div class="rt-head"><div><div class="rt-title">${esc(r.name)}</div><div class="rt-path">${esc(r.path)}</div></div>
        <button class="star" data-fav="${r.id}" aria-pressed="${favs.includes(r.id)}" aria-label="즐겨찾기">${favs.includes(r.id) ? "★" : "☆"}</button></div>
        ${eta}<div class="times">${cells || `<div class="msg" style="grid-column:1/-1">운행하지 않아요</div>`}</div>
        ${warns.map(w => `<div class="note">⚠ ${esc(w)}</div>`).join("")}</div>`;
    });
  });
  $("#routes").innerHTML = html || `<div class="card msg">즐겨찾기한 노선이 없어요. 노선 카드의 ☆를 눌러 추가해요.</div>`;
}

document.addEventListener("click", e => {
  const d = e.target.closest("[data-day]"), f = e.target.closest("[data-filter]"), s = e.target.closest("[data-fav]");
  if (d) { ui.day = d.dataset.day; renderShuttle(); }
  else if (f) { ui.filter = f.dataset.filter; saveUi(); renderShuttle(); }
  else if (s) {
    const id = s.dataset.fav;
    favs = favs.includes(id) ? favs.filter(x => x !== id) : [...favs, id];
    store.set("dvb-fav", favs); renderShuttle();
  }
});

/* ===== 7. 실시간 (공공데이터 호출 dg(), 정류장 찾기 gbisSid()) ===== */
// ⚠ 경기도 GBIS v2 응답 형식은 키로 직접 확인하지 못했어요. 형식이 다르면 이 구간만 고쳐요.
const GBIS = "https://apis.data.go.kr/6410000";
const usage = () => { const u = store.get("dvb-usage", {}); const t = seoulNow().ymd; return u.d === t ? u : { d: t, n: 0 }; };
function bumpUsage() { const u = usage(); u.n++; store.set("dvb-usage", u); renderKeyNote(); }
const safeDecode = k => { try { return decodeURIComponent(k); } catch (e) { return k; } };

async function dg(path, params) {
  if (!KEYS.DATA_GO_KR) throw new Error("NOKEY");
  const q = new URLSearchParams({ ...params, format: "json" });
  const url = `${GBIS}/${path}?serviceKey=${encodeURIComponent(safeDecode(KEYS.DATA_GO_KR))}&${q}`;
  bumpUsage();
  const r = await fetch(url);
  let j;
  try { j = await r.json(); } catch (e) { throw new Error("BADFORMAT"); }
  const h = j && j.response && j.response.msgHeader;
  if (h && String(h.resultCode) !== "0" && String(h.resultCode) !== "4") throw new Error("API:" + (h.resultMessage || h.resultCode));
  const body = j && j.response && j.response.msgBody;
  if (Array.isArray(body)) return body;
  if (body && typeof body === "object") { const a = Object.values(body).find(Array.isArray); return a || []; }
  return [];
}

const stationCache = store.get("dvb-stations", {});
async function gbisSid(place) {
  if (stationCache[place.name]) return stationCache[place.name];
  let list = [];
  for (const kw of [place.name, place.name.split(".")[0]]) {
    list = await dg("busstationservice/v2/getBusStationListv2", { keyword: kw });
    list = list.filter(s => (s.stationName || "").replace(/\s/g, "") === place.name);
    if (list.length) break;
  }
  const out = list.map(s => ({ id: s.stationId, no: s.mobileNo, name: s.stationName }));
  if (out.length) { stationCache[place.name] = out; store.set("dvb-stations", stationCache); }
  return out;
}

/* ===== 8. 정류장별 보드 (PLACES, renderCityBoard()) ===== */
const lastFetch = {};
const crowd = { 1: "여유", 2: "보통", 3: "혼잡", 4: "매우 혼잡" };
function renderCityBoard() {
  $("#cityBanner").textContent = KEYS.DATA_GO_KR
    ? "정류장을 눌러 펼치면 곧 도착 정보를 불러와요. 펼친 정류장만 60초마다 갱신해요."
    : "곧 도착 정보를 보려면 아래 'API 키 설정'에서 공공데이터포털 인증키를 입력해요. 키는 이 기기에만 저장돼요.";
  $("#places").innerHTML = PLACES.map((p, i) => `<details class="card place" data-i="${i}">
    <summary><div><div class="pn">${esc(p.name)}</div><div class="ps">${p.no ? "정류장 번호 " + p.no : "정류장 번호는 불러온 뒤 표시해요"}</div></div><span class="label">▾</span></summary>
    <div class="body"><div class="msg">펼치면 불러와요.</div></div></details>`).join("");
  document.querySelectorAll("details.place").forEach(d => d.addEventListener("toggle", () => { if (d.open) loadPlace(d, false); }));
}

async function loadPlace(d, force) {
  const p = PLACES[+d.dataset.i], body = $(".body", d);
  if (!KEYS.DATA_GO_KR) { body.innerHTML = `<div class="msg">인증키가 없어서 곧 도착 정보를 못 보여줘요. 'API 키 설정'에 키를 입력해요.</div>`; return; }
  if (force && Date.now() - (lastFetch[p.name] || 0) < 10000) return; // 수동 새로고침 10초 간격
  lastFetch[p.name] = Date.now();
  body.innerHTML = `<div class="msg">불러오는 중이에요…</div>`;
  try {
    const sts = await gbisSid(p);
    if (!sts.length) { body.innerHTML = `<div class="msg err">정류장 ID를 찾지 못했어요. 정류장 이름이 다르게 등록됐을 수 있어요.</div>`; return; }
    let html = "";
    for (let k = 0; k < sts.length; k++) {
      const arr = await dg("busarrivalservice/v2/getBusArrivalListv2", { stationId: sts[k].id });
      html += `<div class="dir">${sts.length > 1 ? "방향 " + "①②③④"[k] + " · " : ""}${esc(sts[k].name)}${sts[k].no ? " (" + esc(sts[k].no) + ")" : ""}</div>`;
      html += arr.length ? arr.map(a => {
        const s1 = a.predictTimeSec1 !== undefined && a.predictTimeSec1 !== "" ? +a.predictTimeSec1 : null;
        const eta = s1 === null ? "정보 없음" : s1 <= 60 ? "곧 도착" : Math.ceil(s1 / 60) + "분 후";
        return `<div class="arr"><div class="l"><b>${esc(a.routeName || "")}</b><small>${a.routeDestName ? esc(a.routeDestName) + " 방면" : ""}</small></div>
          <div class="r"><b>${eta}</b><small>${a.locationNo1 ? a.locationNo1 + "정류장 전" : ""}${crowd[a.crowded1] ? " · " + crowd[a.crowded1] : ""}</small></div></div>`;
      }).join("") : `<div class="msg">도착 예정 버스가 없어요.</div>`;
    }
    body.innerHTML = html + `<div class="row" style="margin:10px 0 0"><button class="chip" data-refresh="${d.dataset.i}">새로고침</button><span class="label">${pad(seoulNow().hh)}:${pad(seoulNow().mm)} 기준</span></div>`;
  } catch (e) {
    const m = String(e.message);
    body.innerHTML = `<div class="msg err">${m === "BADFORMAT" ? "응답을 읽지 못했어요. 인증키가 맞는지, 'GBIS 버스도착정보 v2' 활용 신청이 승인됐는지 확인해요."
      : m.startsWith("API:") ? "공공데이터 서버가 오류를 돌려줬어요: " + esc(m.slice(4)) : "네트워크 오류예요. 연결을 확인하고 새로고침해요."}</div>`;
  }
}
document.addEventListener("click", e => {
  const r = e.target.closest("[data-refresh]");
  if (r) { e.preventDefault(); loadPlace($(`details.place[data-i="${r.dataset.refresh}"]`), true); }
});
function refreshOpenPlaces(auto) {
  if (!KEYS.DATA_GO_KR || document.visibilityState !== "visible") return;
  document.querySelectorAll("details.place[open]").forEach(d => loadPlace(d, false));
}
setInterval(() => { if (ui.screen === "city") refreshOpenPlaces(true); }, 60000);

/* ===== 9. API 키 설정 ===== */
function renderKeyNote() {
  $("#keyNote").textContent = `오늘 호출 ${usage().n}회 / 하루 1,000회 한도예요. 키는 코드에 들어가지 않고 이 브라우저(localStorage)에만 저장돼요.`;
}
$("#keyDG").value = KEYS.DATA_GO_KR || "";
$("#keySave").onclick = () => {
  const v = $("#keyDG").value.trim();
  KEYS = v ? { ...KEYS, DATA_GO_KR: v } : {};
  store.set("dvb-keys", KEYS);
  Object.keys(stationCache).forEach(k => delete stationCache[k]); store.set("dvb-stations", stationCache);
  renderCityBoard(); refreshOpenPlaces(false);
};
$("#keyClear").onclick = () => { KEYS = {}; store.set("dvb-keys", KEYS); $("#keyDG").value = ""; renderCityBoard(); };

/* ===== 10. 공통 갱신 ===== */
function tick() {
  const n = seoulNow();
  $("#clockT").textContent = `${pad(n.hh)}:${pad(n.mm)}`;
  $("#clockD").textContent = `${+n.ymd.slice(5, 7)}월 ${+n.ymd.slice(8)}일 (${WD[n.dow]})`;
  renderShuttle();
}
renderCityBoard(); renderKeyNote(); setScreen(ui.screen); tick();
setInterval(() => { if (document.visibilityState === "visible") tick(); }, 20000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") tick(); });
</script>
</body>
</html>
